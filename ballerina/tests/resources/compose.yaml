# DynamoDB Local container for development reference.
#
# NOTE: The unit tests in `ballerina/tests/memory_store_test.bal` do NOT require this
# container or AWS credentials — they run entirely against an in-memory fake
# (`FakeDynamoDbClient`) installed via `test:mock(dynamodb:Client, ...)`.
#
# This file is retained so that the test harness can target a local DynamoDB endpoint
# once the upstream `ballerinax/aws.dynamodb` connector (which currently hardcodes the
# endpoint to `dynamodb.<region>.amazonaws.com` and exposes no endpoint-override) adds
# endpoint-override support and we want to add Docker-based integration tests on top of
# the existing unit tests.
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: dynamodb-store
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8000 && echo ok >&3"]
      interval: 5s
      timeout: 5s
      retries: 10
